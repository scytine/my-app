<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shop – Biasbox</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;800;900&family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ece9ff;--surface:#ffffff;--ink:#1a1246;--muted:#5b5588;--line:#cfc9f5;
  --accent:#ff3d9a;--accent2:#7a5cff;--on-accent:#fff;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#120d33;--surface:#1d1650;--ink:#f1eeff;--muted:#a9a2dd;--line:#352c7a}}
:root[data-theme="dark"]{--bg:#120d33;--surface:#1d1650;--ink:#f1eeff;--muted:#a9a2dd;--line:#352c7a}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.55;overflow-x:hidden;transition:background .4s}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
a{color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.d{font-family:"Unbounded","Arial Black",system-ui,sans-serif}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:.9rem clamp(1rem,4vw,3rem);background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(10px)}
.logo{font-weight:900;font-size:1.15rem;text-decoration:none;letter-spacing:-.02em}
.logo i{font-style:normal;color:var(--accent)}
nav{display:flex;gap:1.4rem;font-weight:600;font-size:.95rem}
nav a{text-decoration:none;color:var(--muted)}nav a:hover{color:var(--ink)}
.cart{border:2px solid var(--ink);background:none;color:var(--ink);font:700 .9rem "Figtree",sans-serif;padding:.45rem 1rem;border-radius:99px;cursor:pointer}

/* HERO */
.hero{position:relative;padding:clamp(1.5rem,4vw,3rem) clamp(1rem,4vw,3rem) 0;overflow:hidden}
.pick{display:flex;flex-wrap:wrap;gap:.5rem;margin-bottom:1.4rem}
.pick button{font:700 .9rem "Figtree",sans-serif;border:2px solid var(--ink);background:transparent;color:var(--ink);padding:.4rem .95rem;border-radius:99px;cursor:pointer;transition:.2s}
.pick button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent);transform:rotate(-2deg) scale(1.05)}
.stage{display:grid;grid-template-columns:1.25fr 1fr;gap:2rem;align-items:center;min-height:min(70vh,620px)}
.kicker{font-size:clamp(1rem,2vw,1.3rem);font-weight:700;margin:0 0 .4rem;color:var(--muted)}
.gname{font-weight:900;font-size:clamp(3rem,10.5vw,9rem);line-height:.88;letter-spacing:-.04em;margin:0;color:var(--accent);word-break:break-word;transition:color .3s}
.what{font-weight:800;font-size:clamp(1.3rem,3.4vw,2.6rem);line-height:1.1;letter-spacing:-.02em;margin:1rem 0 .8rem;max-width:18ch}
.sub{max-width:44ch;color:var(--muted);font-size:1.1rem;margin:0 0 1.5rem}
.cta{display:inline-block;background:var(--ink);color:var(--bg);font-weight:700;padding:.9rem 1.6rem;border-radius:14px;text-decoration:none;box-shadow:6px 6px 0 var(--accent);transition:transform .15s,box-shadow .15s}
.cta:hover{transform:translate(3px,3px);box-shadow:3px 3px 0 var(--accent)}
.cta+.cta{background:transparent;color:var(--ink);border:2px solid var(--ink);box-shadow:none;margin-left:.6rem}

/* CSS-drawn merch trio */
.trio{position:relative;height:min(62vh,520px);min-height:340px}
.stick{position:absolute;left:50%;top:2%;width:64px;height:92%;transform:translateX(-50%) rotate(14deg);transform-origin:50% 90%}
.stick .orb{position:absolute;top:0;left:50%;width:150px;height:150px;transform:translateX(-50%);border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0 8%,var(--accent) 40%,var(--accent2) 100%);box-shadow:0 0 60px 14px color-mix(in srgb,var(--accent) 60%,transparent);animation:glow 3s ease-in-out infinite}
.stick .orb::after{content:"♥";position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-size:3.2rem;opacity:.9}
.stick .rod{position:absolute;top:140px;bottom:0;left:50%;width:34px;transform:translateX(-50%);border-radius:10px 10px 22px 22px;background:linear-gradient(90deg,#d9d4ff,#fff 40%,#aaa3e8)}
.stick .rod::before{content:"";position:absolute;top:34%;left:-6px;right:-6px;height:16px;border-radius:8px;background:var(--ink)}
.album{position:absolute;left:0;bottom:3%;width:56%;aspect-ratio:1;background:var(--ink);border-radius:8px;transform:rotate(-9deg);box-shadow:10px 14px 0 color-mix(in srgb,var(--accent2) 55%,transparent);overflow:hidden;display:grid;place-items:center}
.album::before{content:"";position:absolute;inset:12% 12%;border-radius:50%;background:conic-gradient(from 20deg,var(--accent),var(--accent2),#35e0d0,var(--accent));opacity:.95}
.album::after{content:"";position:absolute;width:16%;aspect-ratio:1;border-radius:50%;background:var(--bg)}
.album span{position:absolute;left:8%;bottom:6%;z-index:2;color:#fff;font:800 .7rem "Unbounded",sans-serif}
.pc{position:absolute;right:2%;bottom:0;width:34%;aspect-ratio:2/3;border-radius:10px;background:linear-gradient(135deg,#fff 0,#ffd6ee 30%,#cfe9ff 55%,#e3d4ff 80%,#fff);border:7px solid #fff;transform:rotate(11deg);box-shadow:0 14px 30px rgba(26,18,70,.35);display:flex;align-items:flex-end;padding:.5rem;font:800 .65rem "Unbounded",sans-serif;color:#1a1246}
.pc::before{content:"";position:absolute;inset:8% 10% 24%;border-radius:6px;background:linear-gradient(160deg,var(--accent),var(--accent2));opacity:.85}
.pc b{position:relative}
@keyframes glow{50%{box-shadow:0 0 90px 28px color-mix(in srgb,var(--accent) 70%,transparent)}}
@media(prefers-reduced-motion:reduce){.stick .orb{animation:none}html{scroll-behavior:auto}*{transition:none!important}}

.ticker{margin-top:2rem;border-block:2px solid var(--ink);overflow:hidden;white-space:nowrap;font-weight:900;padding:.6rem 0}
.ticker div{display:inline-block;animation:tick 28s linear infinite;padding-left:100%}
@keyframes tick{to{transform:translateX(-100%)}}

section{padding:clamp(3rem,7vw,6rem) clamp(1rem,4vw,3rem)}
h2{font-weight:800;font-size:clamp(1.8rem,4.5vw,3.4rem);letter-spacing:-.03em;line-height:1.05;margin:0 0 .6rem;max-width:20ch}
.lead{color:var(--muted);max-width:50ch;margin:0 0 2.2rem;font-size:1.08rem}

/* shop */
[hidden]{display:none!important}
#shoptitle{font-weight:800;font-size:clamp(2rem,6vw,4.5rem);letter-spacing:-.035em;line-height:1;margin:0 0 .6rem;color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:1.4rem}
.card{background:var(--surface);border:2px solid var(--ink);border-radius:22px 22px 22px 4px;padding:1rem;display:flex;flex-direction:column;gap:.7rem}
.card:nth-child(even){border-radius:22px 4px 22px 22px}
.thumb{aspect-ratio:4/3;border-radius:14px;display:grid;place-items:center;font-size:3.4rem;background:linear-gradient(135deg,var(--c1),var(--c2))}
.card h3{margin:0;font-size:1.05rem;line-height:1.25}
.card .g{font-size:.9rem;color:var(--muted);margin:0}
.row{display:flex;justify-content:space-between;align-items:center;margin-top:auto}
.price{font-weight:900}
.add{border:0;background:var(--ink);color:var(--bg);font:700 .85rem "Figtree",sans-serif;padding:.5rem .9rem;border-radius:10px;cursor:pointer}
.add.done{background:var(--accent);color:#fff}

.how{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:2rem;border-top:2px solid var(--ink);padding-top:2rem}
.how h3{margin:0 0 .4rem;font-size:1.15rem}.how p{margin:0;color:var(--muted)}

footer{padding:2rem clamp(1rem,4vw,3rem) 3rem;color:var(--muted);font-size:.9rem;display:flex;flex-wrap:wrap;justify-content:space-between;gap:1rem}

@media(max-width:820px){
  header{flex-wrap:wrap}nav{width:100%;order:3;overflow-x:auto;gap:1.1rem;padding-bottom:.2rem}
  .stage{grid-template-columns:1fr;min-height:0}
  .trio{height:360px}
  .cta+.cta{margin:.6rem 0 0}
}

[hidden]{display:none!important}
#shoptitle{font-weight:800;font-size:clamp(2rem,6vw,4.5rem);letter-spacing:-.035em;line-height:1;margin:0 0 .6rem;color:var(--accent)}
.navbtn{font:600 .95rem "Figtree",sans-serif;background:none;border:0;color:var(--muted);cursor:pointer;padding:0}.navbtn:hover{color:var(--ink)}
.thumb{overflow:hidden}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:1rem}
.gal figure{margin:0;position:relative;aspect-ratio:1;border-radius:18px;border:2px solid var(--ink);display:grid;place-items:center;font-size:3.6rem;overflow:hidden;background:linear-gradient(135deg,var(--c1),var(--c2))}
.gal figure:first-child{grid-column:span 2;aspect-ratio:2/1}
.gal figcaption{position:absolute;left:.6rem;bottom:.5rem;font:700 .8rem "Figtree",sans-serif;color:#1a1246;background:rgba(255,255,255,.85);padding:.15rem .6rem;border-radius:99px}
.gal img{width:100%;height:100%;object-fit:cover}
.about{max-width:60ch;font-size:1.1rem;color:var(--muted)}
.badge{position:fixed;left:max(1rem,env(safe-area-inset-left,0px));bottom:calc(1rem + env(safe-area-inset-bottom,0px));width:76px;height:76px;border-radius:50%;z-index:25;border:3px solid var(--ink);background:conic-gradient(from 200deg,var(--accent),var(--accent2),var(--accent));display:grid;place-items:center;text-decoration:none;box-shadow:4px 4px 0 var(--ink);transition:transform .2s}
.badge:hover{transform:rotate(-8deg) scale(1.06)}
.badge span{width:56px;height:56px;border-radius:50%;background:rgba(18,13,51,.55);color:#fff;display:grid;place-items:center;font:900 1rem "Unbounded",sans-serif}
.scrim{position:fixed;inset:0;background:rgba(26,18,70,.45);z-index:35}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(400px,100%);background:var(--surface);border-left:2px solid var(--ink);z-index:40;display:flex;flex-direction:column;padding:calc(1.2rem + env(safe-area-inset-top,0px)) 1.2rem calc(1.2rem + env(safe-area-inset-bottom,0px));transform:translateX(100%);visibility:hidden;transition:transform .3s,visibility .3s}
.drawer.open{transform:none;visibility:visible}
.dh{display:flex;justify-content:space-between;align-items:center}.dh h2{font-size:1.4rem;margin:0}
#lines{flex:1;overflow:auto;margin:1rem 0}
.line{display:grid;grid-template-columns:52px 1fr auto;gap:.7rem;align-items:center;padding:.6rem 0;border-bottom:1px solid var(--line)}
.lt{width:52px;height:52px;border-radius:12px;display:grid;place-items:center;font-size:1.6rem;background:linear-gradient(135deg,var(--c1),var(--c2));overflow:hidden}
.qty{display:flex;align-items:center;gap:.5rem;font-weight:700}
.qty button{width:28px;height:28px;border-radius:50%;border:2px solid var(--ink);background:none;color:var(--ink);cursor:pointer;font-weight:700}

section{scroll-margin-top:6rem}
#page-shop,#page-gallery,#page-about{min-height:70vh}
.thumb,.lt{position:relative}
.px{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.lg{position:relative;overflow:hidden;display:grid;place-items:center;width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,var(--a),var(--b));color:#fff;font:900 .8rem "Unbounded","Arial Black",sans-serif;border:2px solid #fff}
.dock{position:fixed;left:max(1rem,env(safe-area-inset-left,0px));bottom:calc(1rem + env(safe-area-inset-bottom,0px));width:76px;height:76px;border-radius:50%;z-index:25;border:3px solid var(--ink);background:conic-gradient(from 200deg,var(--accent),var(--accent2),var(--accent));box-shadow:4px 4px 0 var(--ink);overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;transition:height .35s cubic-bezier(.3,1.3,.5,1),border-radius .3s}
.dock.open{height:calc(76px + var(--n)*60px + 12px);border-radius:20px;background:var(--surface)}
.dlist{display:flex;flex-direction:column;gap:8px;padding-top:12px;opacity:0;transition:opacity .2s}
.dock.open .dlist{opacity:1;transition-delay:.15s}
.dock:not(.open) .dlist{visibility:hidden}
.gb{border:0;background:none;padding:2px;border-radius:50%;cursor:pointer;line-height:0}
.gb[aria-pressed="true"]{outline:3px solid var(--accent);outline-offset:1px}
.dtog{flex:none;width:70px;height:70px;border:0;background:none;cursor:pointer;display:grid;place-items:center;color:var(--ink);font:900 1.4rem "Unbounded",sans-serif;padding:0}
.dtog .lg{width:56px;height:56px;font-size:1rem}
</style>
</head>
<body>
<header>
  <a class="logo d" href="index.html">bias<i>box</i></a>
  <nav><a style="color:var(--ink)" href="shop.html">Shop</a><button class="navbtn" id="cartbtn" type="button">Cart (<span id="cc">0</span>)</button><a href="about.html">About us</a><a href="gallery.html">Gallery</a></nav>
</header>
<main id="top">
<section id="shop">
  <h1 class="d" id="shoptitle">Shop Stray Kids</h1>
  <p class="lead">Every item is labeled with the group it belongs to. Switch groups above to change the shop.</p>
  <div class="grid" id="grid"></div>
</section>
</main>
<footer><span>© 2026 Biasbox. Sample storefront with placeholder products and prices.</span><span>Group names belong to their respective agencies.</span></footer>

<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" aria-label="Cart">
  <div class="dh"><h2 class="d">Your cart</h2><button class="navbtn" id="close" type="button">Close</button></div>
  <div id="lines"></div>
  <div><div class="row"><b>Total</b><b class="d" id="total">$0</b></div>
  <button class="cta" id="checkout" type="button" style="border:0;cursor:pointer;width:100%;margin-top:.8rem">Checkout</button>
  <p class="g" id="note" style="color:var(--muted)"></p></div>
</aside>

<div class="dock" id="dock"><div class="dlist" id="list"></div><button class="dtog" id="tog" type="button" aria-label="Choose group" aria-expanded="false"></button></div>
<script>
const $=id=>document.getElementById(id)||document.createElement("div");
// IMAGES: paste links into logo_url and img_url (order: lightstick, album, photocards, hoodie, keyring, posters).
// Remote links load when this file runs on your own site or computer; the hosted preview blocks them and shows the fallback.
const U=["","","","","",""];
const groups=[
 {n:"Stray Kids",m:"SKZ",a:"#ff3d3d",b:"#7a5cff",pc:"Hyunjin",logo_url:"",img_url:[...U]},
 {n:"NewJeans",m:"NJ",a:"#2fa8ff",b:"#a06bff",pc:"Haerin",logo_url:"",img_url:[...U]},
 {n:"SEVENTEEN",m:"SVT",a:"#ff7ac8",b:"#6fa8ff",pc:"Mingyu",logo_url:"",img_url:[...U]},
 {n:"aespa",m:"æ",a:"#b266ff",b:"#22d3c5",pc:"Karina",logo_url:"",img_url:[...U]},
 {n:"TWICE",m:"TW",a:"#ff6a3d",b:"#ff3d9a",pc:"Nayeon",logo_url:"",img_url:[...U]}
];
const items=[
 {t:"Official Lightstick",e:"🪄",p:39,c1:"#ffd6ee",c2:"#d6cbff"},
 {t:"Latest Album, Photobook Ver.",e:"💿",p:24,c1:"#cfe9ff",c2:"#e3d4ff"},
 {t:"Random Photocard Pack (5)",e:"🃏",p:9,c1:"#fff0b8",c2:"#ffd0e4"},
 {t:"Tour Hoodie",e:"🧥",p:58,c1:"#d3f7ee",c2:"#cfd8ff"},
 {t:"Acrylic Keyring",e:"🔑",p:12,c1:"#ffe0cf",c2:"#ffd0f0"},
 {t:"Poster Set (3)",e:"🖼️",p:16,c1:"#e0d6ff",c2:"#c9f1ff"}
];
const store={get(k,d){try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let cur=Math.min(groups.length-1,Math.max(0,+store.get("bb_g",0)||0));const cart=store.get("bb_cart",{});
const px=(u,alt)=>u?`<img class="px" src="${u}" alt="${alt}" loading="lazy" onerror="this.remove()">`:"";
const logo=g=>`<span class="lg" style="--a:${g.a};--b:${g.b}">${g.m}${px(g.logo_url,"")}</span>`;
function render(){
  const g=groups[cur],r=document.documentElement.style;
  r.setProperty("--accent",g.a);r.setProperty("--accent2",g.b);
  $("gname").textContent=g.n;
  $("sub").textContent="Official "+g.n+" merch: the lightstick for the show, the album for the shelf, and the photocards you are still hunting for.";
  $("alb").textContent=g.n.toUpperCase();$("pcn").textContent=g.pc;
  $("shoptitle").textContent="Shop "+g.n;
  $("grid").innerHTML=items.map((it,i)=>`<article class="card"><div class="thumb" style="--c1:${it.c1};--c2:${it.c2}">${it.e}${px(g.img_url[i],it.t)}</div><h3>${it.t.replace("Latest Album",g.n+" Album")}</h3><p class="g">${g.n} official merch</p><div class="row"><span class="price d">$${it.p}</span><button class="add" data-i="${i}">Add to cart</button></div></article>`).join("");
  $("gal").innerHTML=items.map((it,i)=>`<figure style="--c1:${it.c1};--c2:${it.c2}">${it.e}${px(g.img_url[i],it.t)}<figcaption>${g.n} ${it.t.split(",")[0]}</figcaption></figure>`).join("");
  $("list").innerHTML=groups.map((x,i)=>`<button type="button" class="gb" data-i="${i}" title="${x.n}" aria-label="${x.n}" aria-pressed="${i===cur}">${logo(x)}</button>`).join("");
  dockUI();
}
const dockOpen=()=>$("dock").classList.contains("open");
function dockUI(){$("tog").innerHTML=dockOpen()?"✕":logo(groups[cur]);$("tog").setAttribute("aria-expanded",dockOpen())}
$("dock").style.setProperty("--n",groups.length);
$("tog").addEventListener("click",()=>{$("dock").classList.toggle("open");dockUI()});
$("list").addEventListener("click",e=>{const b=e.target.closest(".gb");if(!b)return;cur=+b.dataset.i;store.set("bb_g",cur);$("dock").classList.remove("open");render()});

function drawCart(){
  store.set("bb_cart",cart);
  const ls=Object.entries(cart);
  $("cc").textContent=ls.reduce((s,[,l])=>s+l.q,0);
  $("total").textContent="$"+ls.reduce((s,[,l])=>s+l.q*l.p,0);
  $("lines").innerHTML=ls.length?ls.map(([k,l])=>`<div class="line"><div class="lt" style="--c1:${l.c1};--c2:${l.c2}">${l.e}${px(groups[l.gi].img_url[l.i],"")}</div><div><b>${l.t.split(",")[0]}</b><br><small>${l.g}, $${l.p}</small></div><div class="qty"><button data-k="${k}" data-d="-1" aria-label="Remove one">−</button>${l.q}<button data-k="${k}" data-d="1" aria-label="Add one">+</button></div></div>`).join(""):`<p class="lead">Your cart is empty. Add something from the shop.</p>`;
}
const openCart=o=>{$("drawer").classList.toggle("open",o);$("scrim").hidden=!o};
$("grid").addEventListener("click",e=>{
  const b=e.target.closest(".add");if(!b)return;
  const i=+b.dataset.i,k=cur+"-"+i;
  cart[k]=cart[k]||{...items[i],i,gi:cur,g:groups[cur].n,q:0};cart[k].q++;drawCart();
  b.textContent="Added";b.classList.add("done");setTimeout(()=>{b.textContent="Add to cart";b.classList.remove("done")},1200);
});
$("lines").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;const l=cart[b.dataset.k];l.q+=+b.dataset.d;if(l.q<=0)delete cart[b.dataset.k];drawCart()});
$("cartbtn").addEventListener("click",()=>openCart(true));
$("close").addEventListener("click",()=>openCart(false));
$("scrim").addEventListener("click",()=>openCart(false));
addEventListener("keydown",e=>{if(e.key==="Escape"){openCart(false);$("dock").classList.remove("open");dockUI()}});
$("checkout").addEventListener("click",()=>{$("note").textContent="Checkout isn’t connected in this sample store."});

render();drawCart();
</script>
</body>
</html>
